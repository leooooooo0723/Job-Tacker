server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/job_tracker?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:change-this-in-production}
  expiration: 604800000

deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  model: deepseek-chat

file:
  upload-dir: ./uploads/resumes

logging:
  level:
    com.jobtracker: INFO
    org.springframework.security: WARN
